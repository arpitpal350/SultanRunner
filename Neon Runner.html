<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Aura Surfer - Ultimate</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; 
            background-color: #050508; 
            touch-action: none; 
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
        }
        canvas { display: block; }
        
        /* --- NEON UI STYLING --- */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
        }
        .hud-text {
            font-size: 22px; font-weight: bold; text-shadow: 0 0 10px #00ffff; margin-bottom: 5px;
        }
        #hud-top-left { position: absolute; top: 20px; left: 20px; color: #00ffff; }
        #hud-top-right { position: absolute; top: 20px; right: 20px; text-align: right; }
        
        #pause-btn {
            position: absolute; top: 20px; right: 20px;
            background: transparent; border: 2px solid #ff0055; color: #ff0055;
            font-size: 24px; padding: 5px 15px; cursor: pointer; pointer-events: auto;
            box-shadow: 0 0 10px #ff0055; font-weight: bold; border-radius: 5px;
        }
        #pause-btn:hover { background: #ff0055; color: #000; }

        /* OVERLAY MENU */
        #menu-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 8, 0.85); display: none; 
            flex-direction: column; justify-content: center; align-items: center;
            pointer-events: auto; backdrop-filter: blur(5px);
        }
        h1 { font-size: 50px; color: #bc13fe; text-shadow: 0 0 20px #bc13fe; margin-bottom: 10px; }
        p.subtitle { color: #ffd700; font-size: 20px; margin-bottom: 30px; text-shadow: 0 0 10px #ffaa00; }
        
        .menu-btn {
            background: transparent; border: 2px solid #00ffff; color: #00ffff;
            font-size: 20px; font-family: inherit; padding: 15px 40px; margin: 10px;
            cursor: pointer; font-weight: bold; width: 300px; text-align: center;
            box-shadow: 0 0 10px #00ffff; transition: 0.2s;
        }
        .menu-btn:hover { background: #00ffff; color: #000; box-shadow: 0 0 20px #00ffff; }
        .btn-pink { border-color: #ff0055; color: #ff0055; box-shadow: 0 0 10px #ff0055; }
        .btn-pink:hover { background: #ff0055; color: #000; box-shadow: 0 0 20px #ff0055; }
        .btn-disabled { opacity: 0.4; cursor: not-allowed; border-color: #555; color: #555; box-shadow: none; }
        .btn-disabled:hover { background: transparent; color: #555; box-shadow: none; }
    </style>
</head>
<body>

    <!-- UI LAYER -->
    <div id="ui-layer">
        <div id="hud-top-left">
            <div class="hud-text" id="scoreDisplay">SCORE: 0</div>
            <div class="hud-text" id="coinDisplay" style="color: #ffd700; text-shadow: 0 0 10px #ffaa00;">COINS: 0</div>
            <div class="hud-text" id="boardDisplay" style="color: #bc13fe; text-shadow: 0 0 10px #bc13fe; font-size: 18px;">BOARDS: 3/10</div>
            <div id="buffDisplay" style="font-size: 16px; color: #ff0055; margin-top: 15px; text-shadow: 0 0 8px #ff0055;"></div>
        </div>
        <button id="pause-btn">|| PAUSE</button>
    </div>

    <!-- MENU SYSTEM -->
    <div id="menu-overlay">
        <h1 id="menu-title">PAUSED</h1>
        <p class="subtitle" id="menu-stats">Coins: 0 | Score: 0</p>
        
        <button class="menu-btn" id="btn-resume">RESUME</button>
        <button class="menu-btn btn-pink" id="btn-revive" style="display: none;">REVIVE (500 Coins)</button>
        <button class="menu-btn" id="btn-buy-board">BUY BOARD (300 Coins)</button>
        <button class="menu-btn btn-pink" id="btn-restart">RESTART</button>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.157.0/build/three.module.js';

        // ==========================================
        // 1. CONSTANTS
        // ==========================================
        const SETTINGS = {
            LANE_WIDTH: 3.5,       
            LANE_SWITCH_SPEED: 18, 
            INITIAL_SPEED: 25,     
            MAX_SPEED: 70,         
            ACCELERATION: 0.15,     
            GRAVITY: 90,           
            JUMP_VELOCITY: 32,     
            FAST_FALL_GRAVITY: 200,
            PLAYER_HEIGHT: 2.0,
            PLAYER_DUCK_HEIGHT: 1.0, 
            PLAYER_WIDTH: 1.0,
            PLAYER_DEPTH: 1.0,
            CHUNK_LENGTH: 50,      
            VISIBLE_CHUNKS: 10,     // Increased to push fog back
            DESPAWN_DISTANCE: -40, 
            ROLL_DURATION: 0.85    
        };

        // ==========================================
        // 2. INPUT MANAGER
        // ==========================================
        class InputManager {
            constructor() {
                this.actionQueue = [];
                this.touchStartX = 0;
                this.touchStartY = 0;
                this.minSwipeDistance = 35; 
                this.lastTapTime = 0; 
                this.doubleTapWindow = 300; 

                this.initKeyboard();
                this.initTouch();
            }

            consumeAction() { return this.actionQueue.shift() || null; }
            pushAction(action) { if (this.actionQueue.length < 2) this.actionQueue.push(action); }

            initKeyboard() {
                window.addEventListener('keydown', (e) => {
                    if (window.GAME_STATE !== 'PLAYING') return; // Lock inputs if paused
                    
                    if(["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
                        e.preventDefault();
                    }
                    if (e.code === 'Space') {
                        let currentTime = new Date().getTime();
                        if (currentTime - this.lastTapTime < this.doubleTapWindow) this.pushAction('HOVERBOARD');
                        this.lastTapTime = currentTime;
                    }
                    switch(e.code) {
                        case 'ArrowLeft': case 'KeyA': this.pushAction('LEFT'); break;
                        case 'ArrowRight': case 'KeyD': this.pushAction('RIGHT'); break;
                        case 'ArrowUp': case 'KeyW': case 'Space': this.pushAction('JUMP'); break;
                        case 'ArrowDown': case 'KeyS': this.pushAction('ROLL'); break;
                        case 'Escape': window.dispatchEvent(new Event('toggle-pause')); break;
                    }
                });
            }

            initTouch() {
                window.addEventListener('touchstart', (e) => {
                    if (window.GAME_STATE !== 'PLAYING') return;
                    this.touchStartX = e.changedTouches[0].screenX;
                    this.touchStartY = e.changedTouches[0].screenY;
                }, { passive: false });

                window.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });

                window.addEventListener('touchend', (e) => {
                    if (window.GAME_STATE !== 'PLAYING') return;
                    let dx = e.changedTouches[0].screenX - this.touchStartX;
                    let dy = e.changedTouches[0].screenY - this.touchStartY;

                    if (Math.abs(dx) < this.minSwipeDistance && Math.abs(dy) < this.minSwipeDistance) {
                        let currentTime = new Date().getTime();
                        if (currentTime - this.lastTapTime < this.doubleTapWindow) this.pushAction('HOVERBOARD');
                        this.lastTapTime = currentTime;
                        return; 
                    }

                    if (Math.abs(dx) > Math.abs(dy)) {
                        if (dx > 0) this.pushAction('RIGHT'); else this.pushAction('LEFT');
                    } else {
                        if (dy > 0) this.pushAction('ROLL'); else this.pushAction('JUMP'); 
                    }
                }, { passive: false });
            }
        }

        // ==========================================
        // 3. POWER UP & ECONOMY MANAGER
        // ==========================================
        class PowerUpManager {
            constructor(player) {
                this.player = player;
                this.coins = 1000; // Gave you 1000 to test the shop easily
                this.score = 0;
                this.boardStock = 3; 
                this.maxBoards = 10;

                this.buffs = {
                    hoverboard: { active: false, timer: 0, duration: 30 }, 
                    magnet: { active: false, timer: 0, duration: 15 },
                    sneakers: { active: false, timer: 0, duration: 15 }
                };
                this.updateUI();
            }

            collectCoin() {
                this.coins += 1;
                this.updateUI();
            }

            // Fire from double tap!
            useHoverboard() {
                if (this.buffs.hoverboard.active) return; 
                if (this.boardStock > 0) {
                    this.boardStock--;
                    this.activatePowerUp('hoverboard');
                }
            }

            buyHoverboard() {
                if (this.boardStock >= this.maxBoards) return false;
                if (this.coins >= 300) {
                    this.coins -= 300;
                    this.boardStock++;
                    this.updateUI();
                    return true;
                }
                return false;
            }

            activatePowerUp(type) {
                if (this.buffs[type]) {
                    this.buffs[type].active = true;
                    this.buffs[type].timer = this.buffs[type].duration;
                    if (type === 'hoverboard') this.player.equipHoverboard();
                    if (type === 'sneakers') this.player.jumpMultiplier = 1.6;
                }
                this.updateUI();
            }

            deactivatePowerUp(type) {
                this.buffs[type].active = false;
                if (type === 'hoverboard') this.player.removeHoverboard();
                if (type === 'sneakers') this.player.jumpMultiplier = 1.0;
            }

            breakHoverboard() {
                this.buffs.hoverboard.active = false;
                this.buffs.hoverboard.timer = 0;
                this.player.removeHoverboard();
            }

            update(deltaTime, currentSpeed) {
                this.score += (currentSpeed * deltaTime) * 0.1;
                let buffText = "";

                for (let key in this.buffs) {
                    let buff = this.buffs[key];
                    if (buff.active) {
                        buff.timer -= deltaTime;
                        buffText += `> ${key.toUpperCase()}: ${Math.ceil(buff.timer)}s<br>`;
                        if (buff.timer <= 0) this.deactivatePowerUp(key);
                    }
                }
                this.updateUI(buffText);
            }

            updateUI(buffText = "") {
                document.getElementById('scoreDisplay').innerText = `SCORE: ${Math.floor(this.score)}`;
                document.getElementById('coinDisplay').innerText = `COINS: ${this.coins}`;
                document.getElementById('boardDisplay').innerText = `BOARDS: ${this.boardStock}/${this.maxBoards}`;
                if (buffText !== undefined) document.getElementById('buffDisplay').innerHTML = buffText;
            }
        }

        // ==========================================
        // 4. PLAYER
        // ==========================================
        class Player {
            constructor(scene) {
                this.scene = scene;
                this.currentLane = 0; this.targetX = 0; this.currentX = 0;    
                this.yViewModel = 0; this.velocityY = 0; this.isOnGround = true;
                this.state = 'RUN'; this.rollTimer = 0; this.jumpMultiplier = 1.0; 
                this.hasHoverboard = false; this.isInvincible = false;
                
                this.meshGroup = new THREE.Group();
                this.createAestheticCharacter();
                this.scene.add(this.meshGroup);

                this.hitbox = new THREE.Box3();
                this.updateHitboxDimensions(SETTINGS.PLAYER_HEIGHT);
            }

            createAestheticCharacter() {
                const matCore = new THREE.MeshBasicMaterial({ color: 0x000000 }); 
                const matAura = new THREE.MeshBasicMaterial({ color: 0xbc13fe, transparent: true, opacity: 0.6, wireframe: true });
                const matHalo = new THREE.MeshBasicMaterial({ color: 0x00ffff });

                const core = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.8, 4, 8), matCore);
                core.position.y = 1.0;
                this.meshGroup.add(core);

                this.auraMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.35, 0.9, 8, 16), matAura);
                this.auraMesh.position.y = 1.0;
                this.meshGroup.add(this.auraMesh);

                this.halo = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.03, 8, 24), matHalo);
                this.halo.position.y = 2.0; this.halo.rotation.x = Math.PI / 2;
                this.meshGroup.add(this.halo);
            }

            equipHoverboard() {
                this.hasHoverboard = true;
                if (!this.boardMesh) {
                    const matBoard = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 1.5 });
                    this.boardMesh = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.1, 1.3), matBoard);
                    this.boardMesh.position.y = -0.05; 
                    this.meshGroup.add(this.boardMesh);
                }
                this.boardMesh.visible = true;
                this.meshGroup.position.y += 0.2; 
            }

            removeHoverboard() {
                this.hasHoverboard = false;
                if (this.boardMesh) this.boardMesh.visible = false;
            }

            triggerInvincibility(duration = 2000) {
                this.isInvincible = true;
                let blinkInterval = setInterval(() => { this.meshGroup.visible = !this.meshGroup.visible; }, 100);
                setTimeout(() => {
                    clearInterval(blinkInterval);
                    this.meshGroup.visible = true;
                    this.isInvincible = false;
                }, duration);
            }

            revive() {
                this.state = 'RUN';
                this.meshGroup.rotation.x = 0; // Stand back up
                this.meshGroup.position.y = 0;
                this.velocityY = 0;
                this.triggerInvincibility(3000); // 3 secs immunity on revive
            }

            handleInput(action) {
                if (this.state === 'DEAD') return;
                switch(action) {
                    case 'LEFT':
                        if (this.currentLane > -1) { this.currentLane--; this.targetX = this.currentLane * SETTINGS.LANE_WIDTH; }
                        break;
                    case 'RIGHT':
                        if (this.currentLane < 1) { this.currentLane++; this.targetX = this.currentLane * SETTINGS.LANE_WIDTH; }
                        break;
                    case 'JUMP':
                        if (this.isOnGround && this.state !== 'ROLL') {
                            this.velocityY = SETTINGS.JUMP_VELOCITY * this.jumpMultiplier;
                            this.isOnGround = false; this.state = 'JUMP';
                        }
                        break;
                    case 'ROLL':
                        if (!this.isOnGround) this.velocityY = -SETTINGS.JUMP_VELOCITY; 
                        this.startRoll();
                        break;
                }
            }

            startRoll() {
                if (this.state === 'DEAD') return;
                this.state = 'ROLL'; this.rollTimer = SETTINGS.ROLL_DURATION;
                this.meshGroup.scale.y = 0.5; this.updateHitboxDimensions(SETTINGS.PLAYER_DUCK_HEIGHT);
            }

            endRoll() {
                if (this.state === 'DEAD') return;
                this.state = 'RUN'; this.meshGroup.scale.y = 1.0; this.updateHitboxDimensions(SETTINGS.PLAYER_HEIGHT);
            }

            updateHitboxDimensions(height) {
                const halfW = SETTINGS.PLAYER_WIDTH / 2; const halfD = SETTINGS.PLAYER_DEPTH / 2;
                this.hitbox.min.set(-halfW, 0, -halfD); this.hitbox.max.set(halfW, height, halfD);
            }

            update(deltaTime) {
                if (this.state === 'DEAD') return;

                if (this.auraMesh) {
                    const time = performance.now() * 0.005;
                    this.auraMesh.scale.setScalar(1 + Math.sin(time) * 0.05);
                    this.halo.rotation.z += deltaTime * 2;
                }

                let xDiff = this.targetX - this.currentX;
                if (Math.abs(xDiff) > 0.01) this.currentX += xDiff * SETTINGS.LANE_SWITCH_SPEED * deltaTime;
                else this.currentX = this.targetX;

                let currentGravity = SETTINGS.GRAVITY;
                if (!this.isOnGround && this.velocityY < 0 && this.state === 'ROLL') currentGravity = SETTINGS.FAST_FALL_GRAVITY;
                this.velocityY -= currentGravity * deltaTime;
                this.yViewModel += this.velocityY * deltaTime;

                if (this.state === 'ROLL') {
                    this.rollTimer -= deltaTime;
                    if (this.rollTimer <= 0) {
                        if (this.isOnGround) this.endRoll(); else this.rollTimer = 0.1; 
                    }
                }

                this.meshGroup.position.x = this.currentX;
                this.meshGroup.position.y = this.yViewModel;

                const halfW = SETTINGS.PLAYER_WIDTH / 2; const halfD = SETTINGS.PLAYER_DEPTH / 2;
                const currentHeight = (this.state === 'ROLL') ? SETTINGS.PLAYER_DUCK_HEIGHT : SETTINGS.PLAYER_HEIGHT;
                this.hitbox.min.set(this.currentX - halfW, this.yViewModel, -halfD);
                this.hitbox.max.set(this.currentX + halfW, this.yViewModel + currentHeight, halfD);
            }

            die() {
                if (this.isInvincible) return; 
                if (this.hasHoverboard) {
                    window.dispatchEvent(new Event('hoverboard-broke'));
                    this.removeHoverboard();
                    this.triggerInvincibility();
                    return; 
                }
                this.state = 'DEAD';
                this.meshGroup.rotation.x = Math.PI / 2;
                this.meshGroup.position.y = 0.3;
                window.dispatchEvent(new Event('game-over')); // Inform Game engine
            }
        }

        // ==========================================
        // 5. WORLD SPAWNER
        // ==========================================
        const MAT_FLOOR = new THREE.MeshStandardMaterial({ color: 0x050508, roughness: 0.9 }); 
        const MAT_LANE_LINE = new THREE.MeshBasicMaterial({ color: 0x00ffff }); 
        const MAT_HURDLE = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 1, wireframe: true });
        const MAT_SIGN = new THREE.MeshStandardMaterial({ color: 0xbc13fe, emissive: 0xbc13fe, emissiveIntensity: 0.8 });
        const MAT_TRAIN = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.3 }); 
        const MAT_TRAIN_NEON = new THREE.MeshBasicMaterial({ color: 0x00ffff }); 
        const MAT_RAMP = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 0.5, wireframe: true });
        
        // Items
        const MAT_COIN = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffaa00, emissiveIntensity: 1 });
        const MAT_POWERUP = new THREE.MeshStandardMaterial({ color: 0x00ff00, emissive: 0x00ff00, emissiveIntensity: 1.5, wireframe: true });

        class WorldSpawner {
            constructor(scene) {
                this.scene = scene;
                this.activeChunks = []; this.collidables = []; this.currentSpawnZ = 0; 
                for (let i = 0; i < SETTINGS.VISIBLE_CHUNKS; i++) this.spawnChunk(i === 0); 
            }

            spawnChunk(isSafeZone = false) {
                const chunkGroup = new THREE.Group();
                chunkGroup.position.z = this.currentSpawnZ;

                const floorGeo = new THREE.BoxGeometry(SETTINGS.LANE_WIDTH * 3 + 2, 0.5, SETTINGS.CHUNK_LENGTH);
                const floor = new THREE.Mesh(floorGeo, MAT_FLOOR);
                floor.position.y = -0.25; chunkGroup.add(floor);

                for (let i = -1; i <= 1; i += 2) {
                    const lineGeo = new THREE.PlaneGeometry(0.1, SETTINGS.CHUNK_LENGTH);
                    const line = new THREE.Mesh(lineGeo, MAT_LANE_LINE);
                    line.rotation.x = -Math.PI / 2; line.position.set((SETTINGS.LANE_WIDTH / 2) * i, 0.01, 0);
                    chunkGroup.add(line);
                }

                if (!isSafeZone) this.generateObstacles(chunkGroup);

                this.scene.add(chunkGroup);
                this.activeChunks.push({ mesh: chunkGroup, zPos: this.currentSpawnZ });
                this.currentSpawnZ -= SETTINGS.CHUNK_LENGTH; 
            }

            generateObstacles(chunkGroup) {
                const rowSpacing = 10; const rows = Math.floor(SETTINGS.CHUNK_LENGTH / rowSpacing);
                let blockedLanes = { '-1': 0, '0': 0, '1': 0 };

                for (let r = 1; r < rows; r++) {
                    const rowZ = (SETTINGS.CHUNK_LENGTH / 2) - (r * rowSpacing);
                    const numObstacles = Math.random() > 0.4 ? 2 : 1; 
                    let lanes = [-1, 0, 1].sort(() => 0.5 - Math.random());
                    let obstaclesPlaced = 0;

                    for (let i = 0; i < 3; i++) {
                        let lane = lanes[i];
                        if (blockedLanes[lane] > 0) { blockedLanes[lane]--; continue; }

                        if (obstaclesPlaced < numObstacles) {
                            const rand = Math.random();
                            let type = 'HURDLE';
                            if (rand > 0.92) type = 'RAMP';
                            else if (rand > 0.6) type = 'TRAIN';
                            else if (rand > 0.3) type = 'SIGN';
                            this.buildObstacle(type, lane, rowZ, chunkGroup, blockedLanes);
                            obstaclesPlaced++;
                        } else {
                            if (blockedLanes[lane] > 0) blockedLanes[lane]--;
                            if (Math.random() > 0.7) {
                                for(let c = 0; c < 3; c++) {
                                    if(Math.random() > 0.95) this.buildPowerUp(lane, rowZ + (c * 2.5), 0, chunkGroup);
                                    else this.buildCoin(lane, rowZ + (c * 2.5), 0, chunkGroup);
                                }
                            }
                        }
                    }
                }
            }

            buildCoin(lane, zOffset, yOffset, chunkGroup) {
                const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16), MAT_COIN);
                mesh.rotation.x = Math.PI / 2;
                mesh.position.set(lane * SETTINGS.LANE_WIDTH, yOffset + 0.6, zOffset);
                chunkGroup.add(mesh);
                mesh.userData = { type: 'COIN', isActive: true }; // No AABB needed for items anymore
                this.collidables.push(mesh);
            }

            buildPowerUp(lane, zOffset, yOffset, chunkGroup) {
                const type = ['magnet', 'sneakers'][Math.floor(Math.random() * 2)];
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), MAT_POWERUP);
                mesh.position.set(lane * SETTINGS.LANE_WIDTH, yOffset + 0.8, zOffset);
                chunkGroup.add(mesh);
                mesh.userData = { type: 'POWERUP', powerUpType: type, isActive: true };
                this.collidables.push(mesh);
            }

            buildObstacle(type, lane, zOffset, chunkGroup, blockedLanes) {
                const xPos = lane * SETTINGS.LANE_WIDTH;
                let meshGroup = new THREE.Group();
                let hitbox;

                if (type === 'HURDLE') {
                    const mesh = new THREE.Mesh(new THREE.BoxGeometry(SETTINGS.LANE_WIDTH - 0.2, 1.0, 0.5), MAT_HURDLE);
                    mesh.position.y = 0.5; meshGroup.add(mesh);
                    hitbox = new THREE.Box3().setFromObject(mesh);
                } else if (type === 'SIGN') {
                    const mesh = new THREE.Mesh(new THREE.BoxGeometry(SETTINGS.LANE_WIDTH - 0.2, 1.5, 0.5), MAT_SIGN);
                    mesh.position.y = 2.0; meshGroup.add(mesh);
                    hitbox = new THREE.Box3().setFromObject(mesh);
                } else if (type === 'TRAIN') {
                    const trainLength = 9;
                    const mesh = new THREE.Mesh(new THREE.BoxGeometry(SETTINGS.LANE_WIDTH - 0.2, 3.0, trainLength), MAT_TRAIN);
                    mesh.position.y = 1.5;
                    const strip = new THREE.Mesh(new THREE.BoxGeometry(SETTINGS.LANE_WIDTH - 0.1, 0.1, trainLength + 0.1), MAT_TRAIN_NEON);
                    strip.position.y = 2.5; meshGroup.add(strip);
                    meshGroup.add(mesh);
                    hitbox = new THREE.Box3().setFromObject(mesh);
                    blockedLanes[lane] = 1; 
                    for(let c = -3; c <= 3; c += 2) this.buildCoin(lane, zOffset + c, 6.0, chunkGroup);
                } else if (type === 'RAMP') {
                    const rampLength = 12; const maxHeight = 6.0; 
                    const mesh = new THREE.Mesh(new THREE.BoxGeometry(SETTINGS.LANE_WIDTH - 0.2, 0.2, rampLength), MAT_RAMP);
                    mesh.rotation.x = Math.atan2(maxHeight, rampLength);
                    mesh.position.y = maxHeight / 2; meshGroup.add(mesh);
                    hitbox = new THREE.Box3();
                    hitbox.min.set(-SETTINGS.LANE_WIDTH/2, 0, -rampLength/2);
                    hitbox.max.set(SETTINGS.LANE_WIDTH/2, maxHeight, rampLength/2);
                    meshGroup.userData.maxHeight = maxHeight; blockedLanes[lane] = 1; 
                }

                meshGroup.position.set(xPos, 0, zOffset);
                chunkGroup.add(meshGroup);
                meshGroup.userData = { ...meshGroup.userData, type: type, isActive: true, baseHitbox: hitbox, worldHitbox: new THREE.Box3() };
                this.collidables.push(meshGroup);
            }

            update(deltaTime, currentSpeed) {
                const moveDist = currentSpeed * deltaTime;
                for (let i = this.activeChunks.length - 1; i >= 0; i--) {
                    let chunk = this.activeChunks[i];
                    chunk.mesh.position.z += moveDist;

                    if (chunk.mesh.position.z > Math.abs(SETTINGS.DESPAWN_DISTANCE)) {
                        this.scene.remove(chunk.mesh);
                        this.collidables = this.collidables.filter(obj => obj.parent !== chunk.mesh);
                        this.activeChunks.splice(i, 1);
                        this.currentSpawnZ = this.activeChunks[this.activeChunks.length - 1].mesh.position.z - SETTINGS.CHUNK_LENGTH;
                        this.spawnChunk(false);
                    }
                }

                this.collidables.forEach(obj => {
                    if (obj.userData.isActive) {
                        if (obj.userData.type === 'COIN') obj.rotation.z += deltaTime * 3;
                        if (obj.userData.type === 'POWERUP') { obj.rotation.x += deltaTime * 2; obj.rotation.y += deltaTime * 2; }
                        if (obj.userData.worldHitbox) {
                            obj.userData.worldHitbox.copy(obj.userData.baseHitbox).translate(
                                new THREE.Vector3(obj.position.x, obj.position.y, obj.parent.position.z + obj.position.z)
                            );
                        }
                    }
                });
            }
        }

        // ==========================================
        // 6. COLLISION MANAGER (Distance-based Item Fix)
        // ==========================================
        class CollisionManager {
            update(player, spawner, powerUps) {
                let targetGroundY = 0; let hitFatal = false;
                
                // Get player center mass coordinates
                const pPos = new THREE.Vector3(player.currentX, player.yViewModel + 1.0, 0); 
                const pZMin = -SETTINGS.PLAYER_DEPTH / 2; const pZMax = SETTINGS.PLAYER_DEPTH / 2;
                const pXMin = player.hitbox.min.x; const pXMax = player.hitbox.max.x;

                for (let obj of spawner.collidables) {
                    if (!obj.userData.isActive) continue; 
                    let type = obj.userData.type;

                    // --- FLAWLESS ITEM COLLECTION (Vector Distance) ---
                    if (type === 'COIN' || type === 'POWERUP') {
                        // Calculate item's absolute world position
                        const itemPos = new THREE.Vector3(obj.position.x, obj.position.y, obj.parent.position.z + obj.position.z);
                        let distance = pPos.distanceTo(itemPos);
                        
                        // Normal grab radius is 2 meters. Magnet expands to 12 meters!
                        let grabRadius = (type === 'COIN' && powerUps.buffs.magnet.active) ? 12.0 : 2.0;

                        if (distance < grabRadius) {
                            obj.userData.isActive = false;
                            obj.visible = false;
                            if (type === 'COIN') powerUps.collectCoin();
                            else powerUps.activatePowerUp(obj.userData.powerUpType);
                        }
                        continue; 
                    }

                    // --- SOLID OBSTACLE COLLISION ---
                    let box = obj.userData.worldHitbox;
                    const margin = 0.2;
                    if (pXMax - margin > box.min.x && pXMin + margin < box.max.x) {
                        if (pZMax > box.min.z && pZMin < box.max.z) {
                            if (type === 'RAMP') {
                                let progress = Math.max(0, Math.min(1, box.max.z / (box.max.z - box.min.z))); 
                                targetGroundY = Math.max(targetGroundY, obj.userData.maxHeight * progress);
                            }
                            else if (type === 'TRAIN') {
                                if (player.hitbox.min.y >= box.max.y - 0.5) targetGroundY = Math.max(targetGroundY, box.max.y);
                                else hitFatal = true;
                            }
                            else if (type === 'HURDLE' || type === 'SIGN') {
                                if (player.hitbox.intersectsBox(box)) hitFatal = true;
                            }
                        }
                    }
                }

                player.groundY = targetGroundY;
                if (player.yViewModel < targetGroundY && player.velocityY <= 0) {
                    player.yViewModel = targetGroundY; player.velocityY = 0; player.isOnGround = true;
                    if (player.state === 'JUMP') player.state = 'RUN';
                }
                if (hitFatal && player.state !== 'DEAD') player.die();
            }
        }

        // ==========================================
        // 7. MAIN ENGINE & MENU CONTROLLER
        // ==========================================
        class Game {
            constructor() {
                window.GAME_STATE = 'PLAYING'; // PLAYING, PAUSED, DEAD
                this.initThreeJS();
                this.setupLighting();
                this.bindUI();

                this.inputManager = new InputManager();
                this.player = new Player(this.scene);
                this.spawner = new WorldSpawner(this.scene);
                this.collision = new CollisionManager();
                this.powerUps = new PowerUpManager(this.player);

                // Listeners
                window.addEventListener('hoverboard-broke', () => this.powerUps.breakHoverboard());
                window.addEventListener('game-over', () => this.showDeathMenu());
                window.addEventListener('toggle-pause', () => this.togglePause());

                this.currentSpeed = SETTINGS.INITIAL_SPEED;
                this.lastTime = performance.now();
                this.animate();
            }

            bindUI() {
                this.menuOverlay = document.getElementById('menu-overlay');
                this.menuTitle = document.getElementById('menu-title');
                this.menuStats = document.getElementById('menu-stats');
                
                this.btnResume = document.getElementById('btn-resume');
                this.btnRevive = document.getElementById('btn-revive');
                this.btnBuyBoard = document.getElementById('btn-buy-board');
                
                document.getElementById('pause-btn').addEventListener('click', () => this.togglePause());
                document.getElementById('btn-restart').addEventListener('click', () => location.reload()); // Instant reload
                
                this.btnResume.addEventListener('click', () => this.togglePause());
                
                this.btnBuyBoard.addEventListener('click', () => {
                    if (this.powerUps.buyHoverboard()) this.refreshShopUI();
                });

                this.btnRevive.addEventListener('click', () => {
                    if (this.powerUps.coins >= 500) {
                        this.powerUps.coins -= 500;
                        this.powerUps.updateUI();
                        this.player.revive();
                        this.togglePause(); // Unpause
                    }
                });
            }

            refreshShopUI() {
                this.btnBuyBoard.innerText = `BUY BOARD (300c) [${this.powerUps.boardStock}/${this.powerUps.maxBoards}]`;
                if (this.powerUps.coins < 300 || this.powerUps.boardStock >= this.powerUps.maxBoards) {
                    this.btnBuyBoard.classList.add('btn-disabled');
                } else {
                    this.btnBuyBoard.classList.remove('btn-disabled');
                }
            }

            togglePause() {
                if (window.GAME_STATE === 'DEAD') return; 
                
                if (window.GAME_STATE === 'PLAYING') {
                    window.GAME_STATE = 'PAUSED';
                    this.menuOverlay.style.display = 'flex';
                    this.menuTitle.innerText = "PAUSED";
                    this.menuTitle.style.color = "#00ffff";
                    this.btnResume.style.display = 'block';
                    this.btnRevive.style.display = 'none';
                    this.menuStats.innerText = `Coins: ${this.powerUps.coins} | Score: ${Math.floor(this.powerUps.score)}`;
                    this.refreshShopUI();
                } else {
                    window.GAME_STATE = 'PLAYING';
                    this.menuOverlay.style.display = 'none';
                    // Reset time so physics don't warp after unpausing
                    this.lastTime = performance.now(); 
                }
            }

            showDeathMenu() {
                window.GAME_STATE = 'DEAD';
                this.menuOverlay.style.display = 'flex';
                this.menuTitle.innerText = "CRASHED";
                this.menuTitle.style.color = "#ff0055";
                
                this.btnResume.style.display = 'none';
                this.btnRevive.style.display = 'block';
                this.menuStats.innerText = `Final Score: ${Math.floor(this.powerUps.score)}`;
                this.refreshShopUI();

                if (this.powerUps.coins < 500) {
                    this.btnRevive.classList.add('btn-disabled');
                    this.btnRevive.innerText = "NOT ENOUGH COINS TO REVIVE (500)";
                } else {
                    this.btnRevive.classList.remove('btn-disabled');
                    this.btnRevive.innerText = "REVIVE (500 Coins)";
                }
            }

            initThreeJS() {
                this.scene = new THREE.Scene();
                // Visibility fixed: Fog pushed to 140 meters out!
                this.scene.fog = new THREE.Fog(0x050508, 40, 140); 
                this.scene.background = new THREE.Color(0x050508);

                this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
                // Camera lifted slightly for a better far-view
                this.camera.position.set(0, 6, 9);
                this.camera.lookAt(0, 2, -20);

                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
                document.body.appendChild(this.renderer.domElement);
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            setupLighting() {
                this.scene.add(new THREE.AmbientLight(0xffffff, 0.2));
                const pinkLight = new THREE.DirectionalLight(0xff00aa, 2.0); pinkLight.position.set(10, 20, 10);
                this.scene.add(pinkLight);
                const cyanLight = new THREE.DirectionalLight(0x00ffff, 1.5); cyanLight.position.set(-10, -5, -10);
                this.scene.add(cyanLight);
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                if (window.GAME_STATE === 'PLAYING') {
                    const currentTime = performance.now();
                    let deltaTime = (currentTime - this.lastTime) / 1000;
                    this.lastTime = currentTime;
                    if (deltaTime > 0.1) deltaTime = 0.1;

                    if (this.currentSpeed < SETTINGS.MAX_SPEED) this.currentSpeed += SETTINGS.ACCELERATION * deltaTime;

                    let action = this.inputManager.consumeAction();
                    while (action) {
                        this.player.handleInput(action);
                        if (action === 'HOVERBOARD') this.powerUps.useHoverboard(); // Uses stock now!
                        action = this.inputManager.consumeAction();
                    }

                    this.spawner.update(deltaTime, this.currentSpeed);
                    this.player.update(deltaTime);
                    this.collision.update(this.player, this.spawner, this.powerUps);
                    this.powerUps.update(deltaTime, this.currentSpeed);
                }

                this.renderer.render(this.scene, this.camera);
            }
        }

        window.onload = () => new Game();
    </script>
</body>
